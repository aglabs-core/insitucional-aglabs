name: Qualidade do institucional

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: '3000'
      BASE_PATH: /
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: '10.32.1'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run test:content
      - run: pnpm --filter @workspace/ai-agency run typecheck
      - name: Preparar artigo fictício para validar o build
        env:
          BLOG_FIXTURE: ${{ runner.temp }}/blog-ci.json
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const post = {
              id: "fixture-ci", published: true, read_time: 1,
              slug: "validacao-ci", title: "Artigo fictício do CI",
              content: "Texto de exemplo para conferir o build.",
              category: "sites", excerpt: "Exemplo de validação.",
              created_at: "2026-11-23T00:00:00Z"
            };
            writeFileSync(process.env.BLOG_FIXTURE, JSON.stringify([post]));
          '
      - run: pnpm --filter @workspace/ai-agency run build
        env:
          BLOG_FIXTURE: ${{ runner.temp }}/blog-ci.json
      - name: Conferir início e artigo renderizado
        run: |
          test -s artifacts/ai-agency/dist/index.html
          test -s artifacts/ai-agency/dist/blog/validacao-ci.html

